---
layout: default
---
<section class="page-hero">
  <div class="container">
    <div class="section-title">
      <span class="eyebrow">花漾皙產品</span>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
      <span class="product-agent-note">泡泡臉八德館為花漾皙品牌代理</span>
    </div>
  </div>
</section>
<section class="content-section">
  <div class="container">
    <article class="content-prose">
      {% if page.image %}
      <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">
      {% endif %}
      <div class="brand-disclosure">
        本頁介紹之花漾皙產品為泡泡臉八德館代理品牌。產品是否適合，仍應依個人膚況與實際需求選擇。
      </div>
      {{ content }}
      {% if page.buy_url %}
      <div class="btns" style="margin-top:30px">
        <a class="btn primary" href="{{ page.buy_url }}" target="_blank" rel="noopener">前往購買 →</a>
      </div>
      {% endif %}
    </article>
  </div>
</section>
