---
---
<!doctype html>
<html lang="{{ site.lang | default: 'zh-TW' }}">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FN2GL24QRH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  const originalPageLocation = window.location.href;

  gtag('config', 'G-FN2GL24QRH', {
    page_location: originalPageLocation
  });

  const params = new URLSearchParams(window.location.search);

  if (
    params.has('utm_source') ||
    params.has('utm_medium') ||
    params.has('utm_campaign') ||
    params.has('utm_content')
  ) {
    window.history.replaceState(
      {},
      document.title,
      window.location.pathname + window.location.hash
    );
  }
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% if page.title %}{{ page.title }}｜{% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:type" content="{% if page.layout == 'article' or page.layout == 'product' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}｜{% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/images/environment/store-interior.webp' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/brand/logo.webp' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"BeautySalon",
    "name":"{{ site.business.name }}",
    "url":"{{ '/' | absolute_url }}",
    "telephone":"+886-986-239-526",
    "address":{
      "@type":"PostalAddress",
      "streetAddress":"廣興五街53號",
      "addressLocality":"八德區",
      "addressRegion":"桃園市",
      "addressCountry":"TW"
    },
    "sameAs":[
  "{{ site.business.facebook }}",
  "{{ site.business.instagram }}"
]
  }
  </script>
</head>
<body>
  {% include header.html %}
  <main class="site-main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
