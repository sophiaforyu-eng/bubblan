<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泡泡臉-八德館 | 專屬 Me Time</title>
    
    <!-- 1. 引入 Tailwind CSS (樣式庫) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 引入 React 核心庫 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. 引入 Babel (讓瀏覽器看不懂的 JSX 變成看得懂的 JavaScript) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 解決部分瀏覽器捲動行為與自定義動畫 -->
    <style>
        html { scroll-behavior: smooth; }
        body { -webkit-tap-highlight-color: transparent; }
        
        /* 自定義金色閃爍動畫 */
        @keyframes flash-gold {
            0%, 100% { opacity: 1; color: #FDE047; text-shadow: 0 0 2px rgba(253, 224, 71, 0.5); } 
            50% { opacity: 0.8; color: #FEF08A; text-shadow: none; } 
        }
        .animate-gold-pulse {
            animation: flash-gold 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-white">
    <!-- 這是 React 程式掛載的根目錄，如果這行被誤刪就會一片白 -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 圖標組件定義 (Icons) ---
        const Icon = ({ d, size = 24, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {d}
            </svg>
        );

        const Sparkles = (props) => <Icon d={<><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 5H5"/><path d="M5 7h4"/><path d="M3 5h2"/></>} {...props} />;
        const Clock = (props) => <Icon d={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} {...props} />;
        const Heart = (props) => <Icon d={<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>} {...props} />;
        const CheckCircle = (props) => <Icon d={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} {...props} />;
        const MapPin = (props) => <Icon d={<><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></>} {...props} />;
        const Menu = (props) => <Icon d={<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>} {...props} />;
        const XIcon = (props) => <Icon d={<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>} {...props} />;
        const Star = (props) => <Icon d={<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>} {...props} />;
        const User = (props) => <Icon d={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} {...props} />;
        const ShieldCheck = (props) => <Icon d={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></>} {...props} />;
        const Droplets = (props) => <Icon d={<><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.8-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></>} {...props} />;
        
        // 官方 LINE Logo SVG
        const MessageCircleIcon = ({ className }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M21.19 2.536C18.8 0.902 15.68 0 12.5 0 5.596 0 0 5.176 0 11.53c0 3.326 1.527 6.309 4.068 8.358-.598 2.222-1.68 4.252-1.72 4.332-.092.17.027.38.21.41.05.01.096 0 .142-.016 3.036-.93 5.484-2.186 5.86-2.388.02.012.04.026.06.037 1.253.407 2.6.618 3.98.618 6.904 0 12.5-5.175 12.5-11.53 0-3.23-1.393-6.16-3.91-7.817zm-4.75 11.69c-.27.13-.57.17-.86.11-.29-.05-.54-.22-.71-.46-.38-.54-.42-1.25-.1-1.83.27-.47.78-.76 1.32-.76.13 0 .27.02.4.05.65.17 1.07.78.98 1.45-.04.3-.2.58-.45.79-.16.13-.37.22-.58.26zM13 14h-1c-.55 0-1-.45-1-1s.45-1 1-1h1c.55 0 1 .45 1 1s-.45 1-1 1zm-4.44.22c-.17-.04-.38-.13-.54-.26-.25-.21-.41-.49-.45-.79-.09-.67.33-1.28.98-1.45.13-.03.27-.05.4-.05.54 0 1.05.29 1.32.76.32.58.28 1.29-.1 1.83-.17.24-.42.41-.71.46-.29.06-.59.02-.86-.11zM18.5 7h-11c-.48 0-.91-.34-.99-.81-.08-.47.21-.92.68-1.09l11-4c.48-.17 1.01.07 1.21.53.2.46-.01 1.01-.49 1.21l-.01.01c-.13.05-.27.08-.4.08-.34 0-.66-.19-.84-.5l-9.56 3.48c-.08.03-.16.05-.24.05-.27 0-.53-.14-.68-.38-.25-.41-.14-.94.27-1.19l9.35-3.4c.05-.02.1-.03.16-.03.28 0 .53.15.68.39.25.41.13.94-.28 1.19l-9.15 3.33c-.46.17-.68.68-.51 1.14.12.33.43.53.77.53.11 0 .22-.02.33-.06l8.28-3.01c.46-.17.97.06 1.14.52.17.46-.06.97-.52 1.14l-9.35 3.4c-.05.02-.1.03-.16.03-.28 0-.53-.15-.68-.39-.25-.41-.13-.94-.28 1.19l-9.15 3.33c-.46.17-.68.68-.51-1.14-.17-.46-.68-.68-1.14-.51l-8.28 3.01c-.46.17-.97-.06-1.14-.52-.17-.46.06-.97.52-1.14l9.35-3.4c.05-.02.1-.03.16-.03.28 0 .53.15.68.39.25.41.13.94-.28 1.19l-9.15 3.33c-.46.17-.68.68-.51 1.14.17.46.68.68 1.14.51l8.28-3.01c.46-.17.97.06 1.14.52.17.46-.06.97-.52 1.14z"/>
            </svg>
        );

        // --- 主程式開始 ---
        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // 圖片轉換函式 (使用 Thumbnail API 確保穩定顯示)
            const processImage = (url) => {
                if (!url) return '';
                if (url.includes('drive.google.com')) {
                    try {
                        let id = '';
                        if (url.includes('/file/d/')) {
                            id = url.split('/file/d/')[1].split('/')[0];
                        } else if (url.includes('id=')) {
                            id = url.split('id=')[1].split('&')[0];
                        }
                        if (id) {
                            // 使用 w2560 確保抓到高清圖
                            return `https://drive.google.com/thumbnail?id=${id}&sz=w2560`;
                        }
                    } catch (e) {
                        return url;
                    }
                }
                return url;
            };

            const images = {
                // 直式首屏大圖
                hero_user: 'https://drive.google.com/file/d/1UACAklYP1V9mhVDH3h_-nBMKv9G10t9P/view?usp=sharing',
                // 主理人照片
                founder_user: 'https://drive.google.com/file/d/1gwxnaejqfuwVpZWsU-bUnViAwON4g1QH/view?usp=sharing',
                // 去背 Logo
                logo_user: 'https://drive.google.com/file/d/1BEFOvnXFGPiQjtvYrZ8AMmk1f-FzVfFG/view?usp=sharing',
                
                hero_fallback: 'https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?q=80&w=2070&auto=format&fit=crop',
                founder_fallback: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=1061&auto=format&fit=crop'
            };

            const handleImageError = (e, fallbackUrl) => {
                e.target.onerror = null;
                e.target.src = fallbackUrl;
            };

            // 更新服務價格數據：所有課程內容已優化
            const services = [
                { 
                    id: 1, 
                    name: "泡泡基礎保濕", 
                    price: 888, 
                    originalPrice: 1200, 
                    desc: "適合日常保養", 
                    features: ["氣泡深層吸粉刺", "光譜儀精華導入", "舒壓頭部按摩"], 
                    isMale: false 
                },
                { 
                    id: 2, 
                    name: "泡泡進階保濕", 
                    price: 1088, 
                    originalPrice: 1480, 
                    desc: "加強補水", 
                    features: ["雙重淨膚：氣泡儀+手工清粉刺", "深層精華導入", "光譜儀修護"], 
                    isMale: false, 
                    recommended: true 
                },
                { 
                    id: 3, 
                    name: "水油平衡護理", 
                    price: 1588, 
                    originalPrice: 2200, 
                    desc: "調理膚質", 
                    features: ["手工無痛清粉刺", "專業臉部按摩", "軟膜修護導入"], 
                    isMale: false 
                },
                { 
                    id: 4, 
                    name: "粉刺 out!!", 
                    price: 1588, 
                    originalPrice: 2200, 
                    desc: "藍色主題/男性推薦/深層清潔", 
                    features: ["手工清粉刺", "深層潔淨", "男士也推薦"], 
                    isMale: true 
                },
                { 
                    id: 5, 
                    name: "極致膠原修護", 
                    price: 1888, 
                    originalPrice: 2580, 
                    desc: "頂級抗老", 
                    features: ["膠原彈力導入", "臉部拉提按摩", "奢華精華油封存"], 
                    isMale: false 
                },
            ];

            const scrollToSection = (id) => {
                setIsMenuOpen(false);
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <div className="font-sans text-slate-800 bg-white selection:bg-purple-200">
                    {/* Navigation */}
                    <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-white/95 shadow-md py-2' : 'bg-transparent py-4'}`}>
                        <div className="container mx-auto px-4 flex justify-between items-center">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => window.scrollTo(0, 0)}>
                                <img 
                                    src={processImage(images.logo_user)} 
                                    alt="泡泡臉-八德館" 
                                    className="h-20 w-auto object-contain"
                                    referrerPolicy="no-referrer"
                                    onContextMenu={(e) => e.preventDefault()}
                                    onError={(e) => {
                                        e.target.style.display = 'none';
                                        if(e.target.nextSibling) e.target.nextSibling.classList.remove('hidden');
                                    }}
                                />
                                <span className="text-xl font-bold text-slate-800 tracking-wider">泡泡臉-八德館</span>
                            </div>

                            <div className="hidden md:flex gap-8 items-center">
                                {['關於我們', '妳的煩惱', '服務價目', '立即預約'].map((item, index) => {
                                    const ids = ['about', 'pain', 'pricing', 'booking'];
                                    return (
                                        <button key={index} onClick={() => scrollToSection(ids[index])} className="text-slate-600 hover:text-purple-600 font-medium transition-colors">{item}</button>
                                    );
                                })}
                                <a href="https://lin.ee/NsefTifJ" target="_blank" rel="noopener noreferrer" className="bg-[#06C755] text-white px-4 py-2 rounded-xl font-bold transition-all shadow-lg hover:shadow-green-900/20 flex flex-col items-center justify-center gap-1 group">
                                    <div className="flex items-center gap-2">
                                        <MessageCircleIcon className="w-5 h-5" />
                                        <span>加入官方 LINE</span>
                                    </div>
                                    <span className="text-yellow-300 text-xs font-extrabold animate-gold-pulse tracking-wide">馬上領取$100元泡泡體驗金</span>
                                </a>
                            </div>

                            <button className="md:hidden text-slate-800" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                {isMenuOpen ? <XIcon size={28} /> : <Menu size={28} />}
                            </button>
                        </div>

                        {isMenuOpen && (
                            <div className="md:hidden absolute top-full left-0 w-full bg-white shadow-lg py-4 px-4 flex flex-col gap-4 z-[100]">
                                {['關於我們', '妳的煩惱', '服務價目', '立即預約'].map((item, index) => {
                                    const ids = ['about', 'pain', 'pricing', 'booking'];
                                    return (
                                        <button key={index} onClick={() => scrollToSection(ids[index])} className="text-left text-slate-600 hover:text-purple-600 font-medium py-2 border-b border-slate-100">{item}</button>
                                    );
                                })}
                                <a href="https://lin.ee/NsefTifJ" target="_blank" rel="noopener noreferrer" className="bg-[#06C755] text-white px-5 py-3 rounded-xl font-bold text-center flex flex-col justify-center items-center gap-1">
                                    <div className="flex items-center gap-2">
                                        <MessageCircleIcon className="w-5 h-5" />
                                        <span>加入官方 LINE</span>
                                    </div>
                                    <span className="text-yellow-300 text-xs font-extrabold animate-gold-pulse">馬上領取$100元泡泡體驗金</span>
                                </a>
                            </div>
                        )}
                    </nav>

                    {/* Hero Section */}
                    <section className="relative pt-24 pb-12 md:pt-0 md:h-screen flex items-center bg-slate-50 overflow-hidden">
                        <div className="container mx-auto px-4 h-full">
                            <div className="flex flex-col-reverse md:flex-row items-center h-full gap-8 md:gap-12">
                                <div className="w-full md:w-1/2 flex flex-col justify-center items-start space-y-6 z-10 md:pl-8">
                                    <div className="inline-block px-3 py-1 bg-purple-100 text-purple-600 rounded-full text-sm font-semibold tracking-wide">八德專屬 · 妳的肌膚避風港</div>
                                    <h1 className="text-3xl md:text-5xl lg:text-6xl font-bold leading-tight text-slate-800">別再像陀螺一樣<br/><span className="text-purple-600">轉個不停</span></h1>
                                    <h2 className="text-xl md:text-2xl text-slate-600 font-light">妳值得一段完全屬於自己的 <span className="font-medium text-slate-800">Me Time</span></h2>
                                    <p className="text-slate-500 leading-relaxed max-w-lg text-justify">忙著照顧全世界，卻總是忘了自己？在泡泡臉-八德館，按下生活的暫停鍵，讓綿密泡泡溫柔接住妳的疲憊，找回內心的平靜與發光的肌膚。</p>
                                    <button onClick={() => scrollToSection('booking')} className="bg-purple-600 hover:bg-purple-700 text-white px-8 py-4 rounded-full font-bold text-lg shadow-lg hover:shadow-purple-200 transition-all transform hover:-translate-y-1 flex items-center gap-2">
                                        <Sparkles size={20} /> 預約我的專屬寵愛時光
                                    </button>
                                </div>
                                <div className="w-full md:w-1/2 h-[50vh] md:h-full relative group">
                                    <div className="absolute inset-0 bg-purple-200 rounded-3xl transform rotate-3 scale-95 md:scale-90 translate-x-4 translate-y-4 opacity-50 transition-transform group-hover:rotate-2"></div>
                                    <img src={processImage(images.hero_user)} alt="泡泡臉保養體驗" className="w-full h-full object-cover rounded-3xl shadow-2xl relative z-10 bg-slate-200" referrerPolicy="no-referrer" onContextMenu={(e) => e.preventDefault()} onError={(e) => handleImageError(e, images.hero_fallback)} />
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Pain Points */}
                    <section id="pain" className="py-20 bg-white">
                        <div className="container mx-auto px-4">
                            <div className="text-center max-w-3xl mx-auto mb-16">
                                <h2 className="text-3xl font-bold text-slate-800 mb-4">親愛的，妳是否也常常覺得...</h2>
                                <div className="w-20 h-1 bg-purple-500 mx-auto rounded-full"></div>
                            </div>
                            <div className="grid md:grid-cols-3 gap-8">
                                {[
                                    { icon: <Clock className="w-10 h-10 text-purple-500" />, title: "時間總是不夠用", text: "總是把家人的需求排第一，自己的保養清單卻永遠在最後一行？忙到連好好洗臉都是一種奢侈。" },
                                    { icon: <User className="w-10 h-10 text-purple-500" />, title: "鏡中的自己好疲憊", text: "看著鏡中疲憊蠟黃的臉色，懷念以前那個自信發光的自己？想要改變卻不知道從何開始。" },
                                    { icon: <ShieldCheck className="w-10 h-10 text-purple-500" />, title: "想對自己好又怕踩雷", text: "精打細算每一筆開銷，想對自己好一點，又擔心美容課程充滿隱形消費與推銷壓力？" }
                                ].map((item, i) => (
                                    <div key={i} className="bg-slate-50 p-8 rounded-2xl hover:shadow-xl transition-shadow border border-slate-100">
                                        <div className="bg-white w-20 h-20 rounded-full flex items-center justify-center shadow-sm mb-6 mx-auto">{item.icon}</div>
                                        <h3 className="text-xl font-bold text-slate-800 mb-3 text-center">{item.title}</h3>
                                        <p className="text-slate-600 text-center leading-relaxed">{item.text}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* About Section */}
                    <section id="about" className="py-20 bg-purple-50">
                        <div className="container mx-auto px-4">
                            <div className="flex flex-col md:flex-row items-center gap-12">
                                <div className="w-full md:w-1/2 relative">
                                    <div className="absolute -inset-4 bg-white rounded-full opacity-50 blur-2xl"></div>
                                    <img src={processImage(images.founder_user)} alt="Sophia 主理人" className="relative rounded-2xl shadow-xl w-full max-w-md mx-auto aspect-square object-cover bg-slate-200" referrerPolicy="no-referrer" onContextMenu={(e) => e.preventDefault()} onError={(e) => handleImageError(e, images.founder_fallback)} />
                                    {/* Sophia 資訊框 - 拿掉講師，位置下沉 */}
                                    <div className="absolute -bottom-8 left-1/2 -translate-x-1/2 md:-bottom-8 md:-left-4 md:translate-x-0 bg-white/90 backdrop-blur-sm p-4 rounded-xl shadow-lg border-l-4 border-purple-500 w-64 text-center md:text-left z-20">
                                        <p className="font-bold text-slate-800">Sophia</p>
                                        <p className="text-xs text-slate-500">肌膚管理師 / 國際企業經營碩士</p>
                                    </div>
                                </div>
                                <div className="w-full md:w-1/2 space-y-6">
                                    <h2 className="text-3xl md:text-4xl font-bold text-slate-800">懂肌膚，更懂妳<br/><span className="text-purple-600">想喘口氣的心</span></h2>
                                    <div className="space-y-4 text-slate-600 leading-relaxed text-justify">
                                        <p>我是 Sophia。在擁有肌膚管理師證照與國際企業碩士學位的背後，我更是一個懂生活、也懂疲憊的女性。</p>
                                        <p>我明白那種「忙了一整天，看著鏡子卻覺得自己好黯淡」的心情。正因為理解這種為了生活與家庭全力以赴的累，我創立了「泡泡臉-八德館」。</p>
                                        <p className="font-medium text-purple-700 bg-purple-100 p-4 rounded-lg border-l-4 border-purple-500">這裡不只是一個保養肌膚的地方，更是一個能讓妳卸下多重身分、單純「做回自己」的防空洞。</p>
                                        <p>運用我的專業知識，我希望能用最高效率、最無負擔的方式，讓妳在短暫的休憩後，帶著發光的臉龐與輕盈的心，重新擁抱生活。</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Solution */}
                    <section className="py-20 bg-white">
                        <div className="container mx-auto px-4">
                            <div className="text-center mb-16">
                                <h2 className="text-3xl font-bold text-slate-800 mb-4">為什麼選擇泡泡臉？</h2>
                                <p className="text-slate-600">不僅僅是護膚，更是心靈的深呼吸</p>
                            </div>
                            <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                                {[
                                    { title: "極致 Me Time", desc: "專屬預約制，這段時間只屬於妳，沒有打擾。" },

                                    <div key={idx} className="p-6 rounded-xl bg-white shadow-lg border border-slate-100 hover:-translate-y-1 transition-transform">

                    {/* Pricing */}
                    <section id="pricing" className="py-20 bg-slate-50">

                                <h2 className="text-3xl font-bold text-slate-800 mb-4">透明價格，給精打細算的妳</h2>

                            </div>
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8 justify-center">
                                {services.map((service) => {
                                    const cashback = Math.floor(service.price * 0.1);
                                    return (
                                        <div key={service.id} className={`relative rounded-2xl p-6 shadow-xl flex flex-col transition-all duration-300 hover:-translate-y-2 ${service.isMale ? 'bg-gradient-to-br from-white to-blue-50 border-2 border-blue-200' : service.recommended ? 'bg-white border-2 border-purple-400 ring-4 ring-purple-100' : 'bg-white border border-slate-100'}`}>
                                            {service.recommended && <div className="absolute -top-4 left-1/2 -translate-x-1/2 bg-purple-600 text-white px-4 py-1 rounded-full text-sm font-bold shadow-md">店長推薦</div>}
                                            {service.isMale && <div className="absolute top-4 right-4 bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold">男士推薦</div>}
                                            
                                            <h3 className={`text-xl font-bold mb-2 ${service.isMale ? 'text-blue-800' : 'text-slate-800'}`}>{service.name}</h3>
                                            <p className="text-sm text-slate-500 mb-4 h-5">{service.desc}</p>
                                            
                                            {/* 價格區塊更新：原價字體放大至 text-xl 並加粗，與標題一致 */}
                                            <div className="flex flex-col mb-1 mt-2">
                                                <span className="text-slate-400 text-xl font-bold line-through">原價 ${service.originalPrice}</span>
                                            </div>
                                            <div className="flex items-baseline gap-2 mb-2">

                                            <div className={`mb-6 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-2 ${service.isMale ? 'bg-blue-100 text-blue-800' : 'bg-pink-50 text-pink-700'}`}>

                                            </div>

                                            <button onClick={() => scrollToSection('booking')} className={`w-full py-3 rounded-xl font-bold transition-colors ${service.isMale ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-purple-600 hover:bg-purple-700 text-white'}`}>立即預約體驗</button>
                                        </div>
                                    );
                                })}
                                <div className="rounded-2xl p-6 bg-slate-100 border border-slate-200 flex flex-col justify-center items-center text-center opacity-80 hover:opacity-100 transition-opacity">
                                    <div className="w-12 h-12 bg-slate-200 rounded-full flex items-center justify-center mb-4"><Sparkles className="text-slate-500" /></div>
                                    <h3 className="text-lg font-bold text-slate-800">專業肌膚檢測</h3>
                                    <p className="text-slate-500 text-sm mt-2">深入了解妳的肌膚密碼</p>
                                    <div className="mt-4 text-slate-800">
                                        <span className="line-through text-slate-400 text-sm mr-2">原價 $588</span>
                                        <span className="font-bold text-purple-600">加購價 $100</span>
                                    </div>
                                </div>
                            </div>
                            <div className="mt-8 text-center text-xs text-slate-400">* 回饋金限一個月內使用，單次消費回饋 10%。</div>
                        </div>
                    </section>

                    {/* Social Proof */}
                    <section className="py-16 bg-white border-t border-slate-100">
                        <div className="container mx-auto px-4 text-center">
                            <h3 className="text-2xl font-bold text-slate-800 mb-8">專業認證，讓妳更安心</h3>
                            <div className="flex flex-wrap justify-center gap-4 mb-12">
                                {['國際企業經營碩士', '國家級美容證照', '大學兼任講師', '專業肌膚管理認證'].map((cert, i) => (
                                    <span key={i} className="px-6 py-3 bg-white border border-purple-100 rounded-full shadow-sm text-slate-600 flex items-center gap-2">
                                        <Star size={16} className="text-yellow-400 fill-yellow-400" />{cert}
                                    </span>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <section id="booking" className="py-20 bg-slate-900 text-white">
                        <div className="container mx-auto px-4">
                            <div className="grid md:grid-cols-2 gap-12">
                                <div className="order-2 md:order-1">
                                    <div className="mb-6">
                                        <h2 className="text-3xl font-bold mb-2 text-purple-300">立即預約妳的 Me Time</h2>
                                        <p className="text-slate-400">請在下方選擇適合妳的時間，我們將為妳保留專屬的療癒時光。</p>
                                    </div>
                                    <div className="bg-white rounded-2xl overflow-hidden shadow-2xl h-[600px] w-full">
                                        <iframe src="https://calendar.app.google/ANbU2JBYDhg2NrFEA" style={{border: 0}} width="100%" height="100%" frameBorder="0" title="Google Appointment"></iframe>
                                    </div>
                                </div>
                                <div className="order-1 md:order-2 flex flex-col justify-center space-y-8">
                                    <div className="bg-slate-800/50 p-8 rounded-2xl border border-slate-700">
                                        <h3 className="text-xl font-bold text-white mb-6 flex items-center gap-2"><MapPin className="text-purple-400" /> 聯絡資訊</h3>
                                        <div className="space-y-6">
                                            <div>
                                                <p className="text-slate-400 text-sm mb-1">店鋪地址</p>
                                                <a href="https://www.google.com/maps/search/?api=1&query=桃園市八德區廣興五街53號" target="_blank" rel="noopener noreferrer" className="text-lg hover:text-purple-400 transition-colors flex items-center gap-2">
                                                    桃園市八德區廣興五街53號<span className="text-xs bg-purple-900 text-purple-200 px-2 py-1 rounded">導航</span>
                                                </a>
                                            </div>
                                            <div>
                                                <p className="text-slate-400 text-sm mb-1">預約專線</p>
                                                <a href="tel:0986239526" className="text-lg hover:text-purple-400 transition-colors">0986 239 526</a>
                                            </div>
                                            <div className="pt-4">
                                                <a href="https://lin.ee/NsefTifJ" target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center w-full bg-[#06C755] hover:bg-[#05b34c] text-white font-bold py-4 rounded-xl transition-all shadow-lg hover:shadow-green-900/20 flex flex-col gap-1">
                                                    <div className="flex items-center gap-2">
                                                        <MessageCircleIcon className="w-6 h-6" /><span>加入官方 LINE 諮詢</span>
                                                    </div>
                                                    <span className="text-yellow-300 text-xs font-extrabold animate-gold-pulse">馬上領取$100元泡泡體驗金</span>
                                                </a>
                                                <p className="text-center text-slate-500 text-sm mt-3">或是搜尋 ID 加入我們：<span className="font-bold select-all">@191hkpbi</span></p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="mt-16 pt-8 border-t border-slate-800 text-center text-slate-500 text-sm">
                                &copy; {new Date().getFullYear()} 泡泡臉-八德館. All rights reserved. <br className="md:hidden" /> Designed with <Heart size={12} className="inline text-purple-500 mx-1" /> for Busy Women.
                            </div>
                        </div>
                    </section>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
